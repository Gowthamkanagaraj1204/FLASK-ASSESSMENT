
{% extends "base.html" %}

{% block title %}{{ food.name }} - Tasty Bites{% endblock %}

{% block content %}

<section class="details-card">

    <img
        src="{{ url_for('static', filename='images/' + food.image) }}"
        alt="{{ food.name }}"
        class="details-image">

    <div class="details-info">
        <span class="category">{{ food.category }}</span>

        <h1>{{ food.name }}</h1>

        <p><strong>Food ID:</strong> {{ food.id }}</p>

        <p><strong>Food Type:</strong> {{ food.type }}</p>

        <h2 class="price">₹{{ food.price }}</h2>

        <h3>Description</h3>
        <p>{{ food.description }}</p>

        <a href="{{ url_for('menu') }}" class="btn">
            Back to Menu
        </a>
    </div>

</section>

{% endblock %}
