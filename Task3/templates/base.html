
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Product Catalogue{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <header class="navbar">
        <a href="{{ url_for('product_list') }}" class="logo">
            ShopZone
        </a>

        <nav>
            <a href="{{ url_for('product_list') }}">Home</a>
            <a href="{{ url_for('product_list') }}">Products</a>
        </nav>
    </header>

    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 ShopZone. All rights reserved.</p>
    </footer>

</body>
</html>
